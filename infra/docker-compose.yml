# UberNav local infrastructure — everything runs on your own machine.
# Usage: cd infra && docker compose up --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ubernav_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubernav
      POSTGRES_PASSWORD: ubernav
      POSTGRES_DB: ubernav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubernav -d ubernav"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ubernav_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ubernav_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://ubernav:ubernav@postgres:5432/ubernav?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount source for hot reload in dev, but keep container's node_modules.
      - ../backend:/app
      - backend_node_modules:/app/node_modules

  adminer:
    image: adminer:4
    container_name: ubernav_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  backend_node_modules:
