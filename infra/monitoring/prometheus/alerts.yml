# Alert thresholds. Every number here comes from the load sweep of
# 2026-09-17/18 (tools/load-test/README.md), not from a blog post — an alert
# tuned to someone else's system is noise, and noise gets muted.
groups:
  - name: fairsvia-availability
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Backend replica {{ $labels.instance }} is not scrapeable'
          description: >-
            Prometheus cannot reach /metrics. Either the process is down or it
            is wedged. Check `docker logs fairsvia_backend` and the readiness
            probe at /api/v1/health/ready.

      - alert: HighErrorRate
        # 5xx share of all responses. Ignores 4xx: a client sending bad
        # requests is not an outage.
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: '5xx rate above 1% for 5 minutes'

      - alert: DatabaseDown
        # postgres_exporter reports pg_up 0 when it cannot reach Postgres. Every
        # booking, payment and login needs the database, so this is an outage.
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Postgres is unreachable'
          description: >-
            No trip can be booked or paid. Check `docker ps` for fairsvia_postgres
            and `docker logs fairsvia_postgres`; disk full is the usual cause here.

      - alert: RedisDown
        # Redis holds live driver positions, dispatch offers and the queues.
        # Without it matching stops, even though the API may still answer.
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'Redis is unreachable'
          description: >-
            Dispatch, live locations and background jobs are down. Check
            `docker logs fairsvia_redis`.

      - alert: HighApiLatency
        # p95 across our own routes above 600 ms — the load-test SLO
        # (P95_SLO_MS default). /places/* is excluded: it waits on Google/OSM
        # and has its own VendorErrorRate alert. Needs real traffic (>0.1 req/s)
        # so a single slow request on an idle night does not page anyone.
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{route!~"/api/v1/places.*"}[5m])) by (le)
          ) > 0.6
          and on() sum(rate(http_requests_total[5m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'API p95 latency above 600 ms for 10 minutes'
          description: >-
            Riders feel this as slow screens. Check the HTTP latency panel for
            which route, then Postgres connections and event-loop lag.

      - alert: BackendRestarting
        # More than two restarts in 15 minutes is a crash loop, which /metrics
        # can hide: each restart answers again within seconds, so BackendDown
        # never holds for its 1 minute.
        expr: changes(process_start_time_seconds{job="backend"}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: 'Backend restarted more than twice in 15 minutes'
          description: >-
            Crash loop. `docker logs --tail 200 fairsvia_backend` shows the
            error before each restart; Sentry has the stack once SENTRY_DSN is set.

  - name: fairsvia-safety
    rules:
      - alert: SosRaised
        # No `for:` — a person pressed SOS during a ride; every minute counts.
        expr: increase(sos_alerts_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: 'SOS pressed during a ride ({{ $labels.role }})'
          description: >-
            Open the admin console Safety tab: the incident shows the trip,
            both people, the plate and a map link. Acknowledge it there so the
            team knows someone is on it, then resolve it with a note.

  - name: fairsvia-marketplace
    rules:
      - alert: MatchLatencySlow
        # Measured p95 at the 300-ride ceiling was 2.46s. Alerting at 2.5s
        # means "we are at the edge of what we measured", not a guess.
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(trip_match_duration_seconds_bucket[5m])) by (le)
          ) > 2.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Match p95 above 2.5s (measured ceiling was 2.46s)'
          description: >-
            Riders are waiting longer to be matched. Check dispatch queue depth
            first — backlog there moves before this does.

      - alert: DispatchBacklog
        # The earliest signal in the whole system: the load sweep showed
        # waiting jobs climb here before anything a rider can see goes wrong.
        expr: dispatch_queue_depth{queue="dispatch",state="waiting"} > 50
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Dispatch queue backlog above 50 waiting jobs'
          description: >-
            This precedes rider-visible failure. Check worker health and Redis
            before riders start seeing "no drivers".

      - alert: ActiveTripsNearCeiling
        # 83% of the measured 300-ride ceiling on the dev stack. The prod
        # profile has never been benchmarked, so raise this once it has.
        expr: active_trips > 250
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Active trips above 250 (measured ceiling ~300)'

      - alert: NoDriversOnline
        # Not a bug on its own — but a marketplace with no supply serves
        # nobody, and it is invisible from any purely technical metric.
        expr: sum(drivers_online) == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'No drivers online anywhere for 10 minutes'

      - alert: CancellationSpike
        # Ride anomaly: over 40% of searches started in the last 30 min ended
        # in a cancellation. Guarded on at least 10 searches so a single
        # cancelled test ride at night is not a "spike". `or vector(0)`: the
        # cancelled series only exists after the first cancel since boot.
        expr: >-
          (sum(increase(trips_total{status="cancelled"}[30m])) or vector(0))
          / sum(increase(trips_total{status="matching"}[30m])) > 0.4
          and on() sum(increase(trips_total{status="matching"}[30m])) >= 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Over 40% of rides cancelled in the last 30 minutes'
          description: >-
            Usually long waits (check match latency and drivers online) or a
            pricing/ETA problem. The Business dashboard lists cancel reasons.

      - alert: DriverAcceptanceLow
        # Driver anomaly: under 30% of ride offers accepted in 30 min (with at
        # least 20 offers). Drivers ignoring or refusing offers shows up here
        # before riders start seeing "no drivers".
        expr: >-
          sum(increase(dispatch_offers_total{outcome="accepted"}[30m]))
          / sum(increase(dispatch_offers_total[30m])) < 0.3
          and on() sum(increase(dispatch_offers_total[30m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Drivers accepted under 30% of offers in 30 minutes'
          description: >-
            Check fares against local rates, pickup distances on offers, and
            whether some drivers are online but not responding (expired).

  - name: fairsvia-vendors
    rules:
      - alert: VendorErrorRate
        # The failure that actually happened: 20,370 Google OVER_QUERY_LIMIT
        # errors during the sweep, invisible for hours.
        expr: >-
          sum by (vendor) (rate(vendor_request_duration_seconds_count{status="error"}[5m]))
          / clamp_min(sum by (vendor) (rate(vendor_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.vendor }} error rate above 5%'
          description: >-
            If this is Google, the geo fallback to OSRM/Nominatim should already
            be carrying the traffic — confirm osm request rate has picked up.

      - alert: PaymentFailuresExhausted
        # Retries that eventually succeed are a vendor blip. Exhausted ones are
        # rides that happened and were never paid for.
        expr: increase(payment_failures_total{reason="exhausted"}[15m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'A fare capture exhausted its retries — revenue lost'

  - name: fairsvia-infrastructure
    rules:
      - alert: PgBackupStale
        # Nightly job; 26h allows one late run. Only fires once a backup has
        # ever succeeded — before that the series does not exist, so a stack
        # where backups never ran is NOT caught here (check the README).
        expr: time() - fairsvia_pg_backup_last_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'No verified Postgres backup in over 26 hours'
          description: >-
            Check `docker logs` of the pg_backup service. Until this clears,
            the most recent restorable copy of trips, payments and the driver
            ledger is older than a day.

      - alert: DiskSpaceLow
        # Already breached on the current host (97% used). Left at 90% so it
        # keeps meaning something once that is cleaned up.
        # `mountpoint="/"`, not "/rootfs": node_exporter strips the
        # --path.rootfs prefix when it reports. With the prefix left in, this
        # selector matched nothing and the alert silently could never fire —
        # the worst kind of alert, because the dashboard looks armed.
        expr: >-
          (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.90
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Host disk above 90% full'
          description: >-
            Prometheus itself writes ~1-2 GB/month. Safe to reclaim: Flutter
            build/ and .dart_tool/ dirs. Do NOT run `docker system prune -a`:
            this host also carries unrelated robotics images and the live OSRM
            map data (docs/session-handoff.md, "Disk").

      - alert: HostCpuHigh
        # Whole-host CPU above 90% for 10 min: the backend, Postgres, OSRM and
        # everything else on this box share it.
        expr: >-
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Host CPU above 90% for 10 minutes'
          description: >-
            Check which container with `docker stats --no-stream`. OSRM
            processing and Flutter builds are the usual non-app culprits.

      - alert: HostMemoryHigh
        # Under 10% of RAM available for 10 min — next comes swapping or the
        # OOM killer taking out Postgres or the backend.
        expr: >-
          1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Host memory above 90% for 10 minutes'
          description: >-
            `docker stats --no-stream` for the largest container. Stop
            emulators/builds first; never the database.

      - alert: PostgresConnectionsHigh
        expr: >-
          sum(pg_stat_activity_count) / clamp_min(sum(pg_settings_max_connections), 1) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Postgres using over 80% of max_connections'

      - alert: RedisMemoryHigh
        # Redis holds hot/ephemeral state (GPS, presence). Eviction there is
        # silent data loss on the live map.
        #
        # Guarded on a limit actually being set. Redis reports
        # redis_memory_max_bytes = 0 when `maxmemory` is unconfigured (the
        # default, and the case here), and clamping that denominator to 1 made
        # the ratio the raw byte count — so this fired permanently and would
        # have been muted within a day.
        expr: >-
          redis_memory_max_bytes > 0
          and (redis_memory_used_bytes / redis_memory_max_bytes) > 0.85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Redis above 85% of its memory limit'
