apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: ridevela-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Must match prometheus.yml's scrape_interval, or Grafana picks step
      # sizes that make rate() graphs look spiky for no reason.
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: ridevela-loki
    access: proxy
    url: http://loki:3100

  # Business questions ("how much did we take yesterday") are SQL questions.
  # Prometheus is the wrong store for them — it keeps 30 days of samples, not
  # the ledger. This datasource is READ-ONLY by convention; every dashboard
  # query below is a SELECT.
  - name: Postgres
    type: postgres
    uid: ridevela-postgres
    access: proxy
    url: postgres:5432
    user: ${RIDEVELA_DB_USER}
    secureJsonData:
      password: ${RIDEVELA_DB_PASSWORD}
    jsonData:
      database: ${RIDEVELA_DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
