# Production-style deployment: compiled image (no source mount), TWO
# load-balanced backend replicas behind nginx, isolated volumes. Runs entirely
# separately from the dev stack (docker-compose.yml) — different project name,
# its own Postgres/Redis, and only nginx is published (:8088 HTTP → redirect,
# :8443 HTTPS by default; see HTTP_PORT/HTTPS_PORT below).
#
#   docker compose -p fairsvia_prod -f infra/docker-compose.prod.yml up -d --build
#   curl -k https://localhost:8443/api/v1/health   # -k only while on the placeholder cert
#   docker compose -p fairsvia_prod -f infra/docker-compose.prod.yml down
#
# Set real secrets in backend/.env.prod (copy from backend/.env.prod.example).

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  env_file:
    - ../backend/.env.prod
  environment:
    # Credentials come from infra/.env (see infra/.env.example). No hardcoded
    # defaults so a deploy can't silently ship with weak, public passwords.
    DATABASE_URL: postgresql://fairsvia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/fairsvia?schema=public
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}@redis:6379
    NODE_ENV: production
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  expose:
    - "3000"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: fairsvia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: fairsvia
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairsvia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Require a password so a compromised container can't freely read/write the
    # hot store (driver locations, offers, sessions).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}"]
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Two replicas of the same image. BullMQ makes dispatch/notification jobs
  # process exactly once across both; the Socket.IO Redis adapter fans out
  # realtime events across both.
  backend1:
    <<: *backend
  backend2:
    <<: *backend

  # Nightly verified pg_dump with daily/weekly/monthly rotation. A host bind
  # mount, not a named volume: backups must survive `docker volume rm` and be
  # easy to copy off the box. Restore procedure: infra/backup/README.md.
  pg_backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ["/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: fairsvia
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      PGDATABASE: fairsvia
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-/var/backups/ridevela}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Issues and renews the TLS certificate (infra/tls/README.md).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ["/scripts/certbot-loop.sh"]
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
    volumes:
      - ./tls:/scripts:ro
      - tls_certs:/certs
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot

  # On the real server set HTTP_PORT=80 and HTTPS_PORT=443 in infra/.env —
  # Let's Encrypt and the apps expect the standard ports. The defaults avoid
  # clashing with anything else on a shared box.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["/tls/nginx-start.sh"]
    volumes:
      # The directory, not the single file: a file bind mount pins the old
      # inode, so after a `git pull` a reload would keep serving the old config.
      - ./nginx:/etc/nginx/ridevela:ro
      - ./tls:/tls:ro
      - tls_certs:/etc/nginx/certs:ro
      - acme_webroot:/var/www/certbot:ro
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      - backend1
      - backend2
      - certbot

volumes:
  prod_pgdata:
  prod_redisdata:
  tls_certs:
  letsencrypt:
  acme_webroot:
