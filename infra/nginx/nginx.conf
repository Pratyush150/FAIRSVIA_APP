worker_processes auto;
events { worker_connections 2048; }

http {
  # WebSocket upgrade plumbing.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Two backend replicas. ip_hash keeps a client pinned to one replica so the
  # Socket.IO polling handshake + upgrade land on the same node. (Cross-node
  # broadcasts still work via the Redis adapter.)
  upstream ubernav_backend {
    ip_hash;
    server backend1:3000 max_fails=3 fail_timeout=10s;
    server backend2:3000 max_fails=3 fail_timeout=10s;
  }

  # Basic access log to stdout for container logging.
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Security response headers applied to every served response.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Plain HTTP carries nothing but the Let's Encrypt challenge; everything
  # else is redirected so bearer tokens and OTPs never travel in plaintext.
  server {
    listen 80;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Certificates come from the certbot service (infra/tls/). Mozilla
  # "intermediate" profile: TLS 1.2 + 1.3 only — what iOS ATS and Android
  # require, and still reaches every phone we support.
  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A server-level add_header cancels inheritance of the http-level ones, so
    # all four are listed here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
      # The backend sets these too; drop its copies so each appears once
      # (a doubled X-Frame-Options is treated as invalid by some browsers).
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_pass http://ubernav_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Long timeouts so idle WebSockets aren't dropped.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Block external scrapes of the Prometheus endpoint at the edge; it stays
    # reachable in-cluster for the monitoring stack.
    location = /metrics {
      return 404;
    }
  }
}
