worker_processes auto;
events { worker_connections 2048; }

http {
  # WebSocket upgrade plumbing.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Two backend replicas. ip_hash keeps a client pinned to one replica so the
  # Socket.IO polling handshake + upgrade land on the same node. (Cross-node
  # broadcasts still work via the Redis adapter.)
  upstream ubernav_backend {
    ip_hash;
    server backend1:3000 max_fails=3 fail_timeout=10s;
    server backend2:3000 max_fails=3 fail_timeout=10s;
  }

  # Basic access log to stdout for container logging.
  access_log /dev/stdout;
  error_log  /dev/stderr;

  server {
    listen 80;

    # Surface which replica served a request (handy for verifying LB).
    add_header X-Upstream $upstream_addr always;

    location / {
      proxy_pass http://ubernav_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Long timeouts so idle WebSockets aren't dropped.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
