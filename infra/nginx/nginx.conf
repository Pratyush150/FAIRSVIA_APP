worker_processes auto;
events { worker_connections 2048; }

http {
  # WebSocket upgrade plumbing.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Two backend replicas. ip_hash keeps a client pinned to one replica so the
  # Socket.IO polling handshake + upgrade land on the same node. (Cross-node
  # broadcasts still work via the Redis adapter.)
  upstream ubernav_backend {
    ip_hash;
    server backend1:3000 max_fails=3 fail_timeout=10s;
    server backend2:3000 max_fails=3 fail_timeout=10s;
  }

  # Basic access log to stdout for container logging.
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Security response headers applied to every served response.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  server {
    listen 80;

    # --- TLS ---------------------------------------------------------------
    # Terminate HTTPS here in production. Provide a cert (e.g. Let's Encrypt via
    # certbot, or an internal CA) and enable the block below, then redirect all
    # HTTP to HTTPS so bearer tokens/OTPs never travel in plaintext. If TLS is
    # terminated by an upstream load balancer instead, keep :80 but ensure that
    # LB adds HSTS and does the redirect.
    #
    #   return 301 https://$host$request_uri;   # <- add to this :80 block
    # }
    # server {
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #   ssl_protocols TLSv1.2 TLSv1.3;
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # -----------------------------------------------------------------------

    location / {
      proxy_pass http://ubernav_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Long timeouts so idle WebSockets aren't dropped.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Block external scrapes of the Prometheus endpoint at the edge; it stays
    # reachable in-cluster for the monitoring stack.
    location = /metrics {
      return 404;
    }
  }
}
