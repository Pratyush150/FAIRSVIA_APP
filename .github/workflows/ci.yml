name: CI

# Runs on every push and PR. New features are picked up automatically:
# jest globs **/*.spec.ts and flutter test globs **/*_test.dart, so adding a
# module or a widget test needs no changes here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: type-check (tsc), unit tests, and e2e against real Postgres+Redis.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fairsvia
          POSTGRES_PASSWORD: fairsvia
          POSTGRES_DB: fairsvia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fairsvia"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://fairsvia:fairsvia@localhost:5432/fairsvia?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Type-check / build
        run: npm run build
      - name: Unit tests
        run: npx jest --ci
      - name: E2E tests
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # Integration: run the fake-driver simulations against a live backend. This
  # exercises the realtime (Socket.IO) + dispatch + trip-odometer paths that the
  # HTTP e2e can't reach. Covers the full ride happy-path AND the driven-distance
  # fare recompute.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (live sims)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fairsvia
          POSTGRES_PASSWORD: fairsvia
          POSTGRES_DB: fairsvia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fairsvia"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://fairsvia:fairsvia@localhost:5432/fairsvia?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: development
      # Live-ride watchdog thresholds, shortened so field-issues-check can
      # exercise "driver stopped" in seconds instead of the 3 real minutes.
      # These only gate advisory events to the rider — no effect on dispatch,
      # metering or fares, so the other sims in this job are unaffected.
      STOPPED_AFTER_S: '4'
      OFF_ROUTE_PINGS: '2'
      REROUTE_MIN_GAP_S: '1'
      # The sims default to the local FAIRSVIA stack (host port 3200); in CI
      # the backend listens on 3000 directly.
      BASE_URL: http://localhost:3000/api/v1
      WS_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          node dist/main.js &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/v1/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; exit 1
      - name: Install simulator deps
        working-directory: tools/fake-driver-simulator
        run: npm ci || npm install
      - name: Full ride happy-path
        working-directory: tools/fake-driver-simulator
        run: node full-ride.mjs
      - name: Trip odometer + fare recompute
        working-directory: tools/fake-driver-simulator
        run: node odometer-ride.mjs
      # Regressions for the 2026-09-16 field test: offer-window length, the
      # itemised fare adding up, off-route/stopped advisories firing exactly
      # once and clearing, a non-zero settled fare, and changeable ratings.
      - name: Field-test regressions (offers, advisories, fare, ratings)
        working-directory: tools/fake-driver-simulator
        run: node field-issues-check.mjs
      - name: Marketplace simulation — smoke (dispatch + SLO gate)
        working-directory: tools/simulation-engine
        # No OSRM in CI → straight-line actor motion (still exercises the full
        # two-sided dispatch/offer/lifecycle path). Non-zero exit on any SLO miss.
        env:
          OSRM_BASE_URL: ''
          TIME_SCALE: '60'
        run: |
          npm ci || npm install
          node run.mjs smoke
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Infra: the parts of production that no app test touches. Alert rules must
  # parse, nginx must accept its TLS config, and a backup must restore to the
  # same data — a backup that has never been restored is only a hope.
  # ---------------------------------------------------------------------------
  infra:
    name: Infra (alerts, TLS config, backup round-trip)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fairsvia
          POSTGRES_PASSWORD: fairsvia
          POSTGRES_DB: fairsvia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fairsvia"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: fairsvia
      PGPASSWORD: fairsvia
      PGDATABASE: fairsvia
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules parse
        run: |
          docker run --rm -v "$PWD/infra/monitoring/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check rules /p/alerts.yml
      - name: Compose files are valid
        run: |
          POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci docker compose -f infra/docker-compose.prod.yml config -q
          docker compose -f infra/monitoring/docker-compose.monitoring.yml config -q
      - name: nginx accepts the TLS config
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci" \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem
          docker run --rm --add-host backend1:127.0.0.1 --add-host backend2:127.0.0.1 \
            -v "$PWD/infra/nginx:/etc/nginx/ridevela:ro" -v /tmp/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t -c /etc/nginx/ridevela/nginx.conf
      - name: Backup → restore round-trip
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE drill(id int PRIMARY KEY, note text);
            INSERT INTO drill SELECT g, md5(g::text) FROM generate_series(1,5000) g;"
          docker run --rm --network host -e PGHOST -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -v "$PWD/infra/backup:/scripts:ro" -v /tmp/backups:/backups \
            postgis/postgis:16-3.4 /scripts/pg-backup.sh
          dump=$(ls /tmp/backups/daily/*.dump)
          test -f /tmp/backups/metrics/pg_backup.prom
          docker run --rm --network host -e PGHOST -e PGUSER -e PGPASSWORD \
            -v "$PWD/infra/backup:/scripts:ro" -v /tmp/backups:/backups \
            postgis/postgis:16-3.4 /scripts/pg-restore.sh "/backups/daily/$(basename "$dump")" drill_restore
          live=$(psql -Atc "SELECT count(*), sum(hashtext(note)) FROM drill")
          restored=$(psql -d drill_restore -Atc "SELECT count(*), sum(hashtext(note)) FROM drill")
          echo "live=$live restored=$restored"
          test "$live" = "$restored"

  # ---------------------------------------------------------------------------
  # Flutter: static analysis + widget/bloc tests across the whole workspace.
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (apps + packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Resolve workspace deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Only packages/apps that ship a test/ dir; skips the rest cleanly.
        run: |
          set -e
          shopt -s globstar nullglob
          for d in packages/* apps/*; do
            tests=("$d"/test/**/*_test.dart)
            if [ ${#tests[@]} -gt 0 ]; then
              echo "::group::flutter test $d"
              (cd "$d" && flutter test --reporter expanded)
              echo "::endgroup::"
            fi
          done
      - name: Theme variant tokens (Visual Direction v2 A/B/C + mono)
        # Build-time palettes: each is a different const set, so each is
        # compiled and checked (tokens + WCAG contrast) on its own.
        working-directory: packages/design_system
        run: |
          set -e
          for t in midnight daylight daynight mono indigo lapis marigold copper garnet local ink glass clay3d; do
            echo "::group::THEME=$t"
            flutter test test/theme_variant_test.dart --dart-define=THEME=$t
            echo "::endgroup::"
          done
      - name: Plan D (THEME=local) — full design_system + rider suites
        # Plan D changes more than tokens (type, art, kolam radar, badges,
        # pay strip), so its build runs the whole suites, not just tokens.
        run: |
          set -e
          for d in packages/design_system apps/rider_app; do
            echo "::group::THEME=local flutter test $d"
            (cd "$d" && flutter test --dart-define=THEME=local)
            echo "::endgroup::"
          done
      - name: Plan E "Ink & Paper" build (THEME=ink)
        # Plan E changes drawing, not just tokens (Light icons, serif moments,
        # ruled sheets, the ticket receipt), so its widgets and the rider
        # sheets that use them are tested in the ink build itself.
        run: |
          set -e
          (cd packages/design_system && flutter test --dart-define=THEME=ink)
          (cd packages/core && flutter test --dart-define=THEME=ink)
          (cd apps/rider_app && flutter test --dart-define=THEME=ink \
            test/plan_e_screens_test.dart test/ride_sheets_a11y_test.dart \
            test/live_ride_sheets_test.dart test/completed_sheet_tip_test.dart \
            test/driver_info_sheet_test.dart test/ride_sheet_layout_test.dart \
            test/ride_map_layer_test.dart test/ride_cards_test.dart)

      - name: Plan G "3D Clay" build (THEME=clay3d)
        # Plan G swaps every Phosphor icon for the Phosphor3D colour-bitmap
        # font (CBDT/CBLC + sbix) and adds 3D hero art, so the whole suites
        # run in that build — including clay3d_icons_test, which renders the
        # real font and asserts coloured pixels.
        run: |
          set -e
          for d in packages/design_system packages/core apps/rider_app apps/driver_app; do
            echo "::group::THEME=clay3d flutter test $d"
            (cd "$d" && flutter test --dart-define=THEME=clay3d)
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Android build: the rider and driver apps ship on phones, so a web build is
  # not proof they compile. This catches Gradle/manifest/plugin breakage — the
  # kind a `flutter build web` happily sails past.
  #
  # iOS is deliberately absent: it needs macOS + Xcode, which this project does
  # not have. iOS code and config are kept building-ready and reviewed by hand;
  # nothing here should be read as "iOS was built".
  # ---------------------------------------------------------------------------
  android-build:
    name: Android build (debug)
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the phone apps
        run: |
          set -e
          for app in rider_app driver_app; do
            echo "::group::assembleDebug $app"
            (cd "apps/$app" && flutter build apk --debug \
              --dart-define=API_BASE_URL=http://10.0.2.2:3000/api/v1)
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Web build: proves all three apps compile for release (artifact of record).
  # ---------------------------------------------------------------------------
  web-build:
    name: Web build (release)
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build all three web apps
        run: |
          set -e
          for app in rider_app driver_app admin_app; do
            echo "::group::build $app"
            (cd "apps/$app" && flutter build web --release --pwa-strategy=none)
            echo "::endgroup::"
          done
