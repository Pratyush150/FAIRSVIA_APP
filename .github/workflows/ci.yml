name: CI

# Runs on every push and PR. New features are picked up automatically:
# jest globs **/*.spec.ts and flutter test globs **/*_test.dart, so adding a
# module or a widget test needs no changes here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: type-check (tsc), unit tests, and e2e against real Postgres+Redis.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubernav
          POSTGRES_PASSWORD: ubernav
          POSTGRES_DB: ubernav
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ubernav"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ubernav:ubernav@localhost:5432/ubernav?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Type-check / build
        run: npm run build
      - name: Unit tests
        run: npx jest --ci
      - name: E2E tests
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # Integration: run the fake-driver simulations against a live backend. This
  # exercises the realtime (Socket.IO) + dispatch + trip-odometer paths that the
  # HTTP e2e can't reach. Covers the full ride happy-path AND the driven-distance
  # fare recompute.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (live sims)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubernav
          POSTGRES_PASSWORD: ubernav
          POSTGRES_DB: ubernav
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ubernav"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ubernav:ubernav@localhost:5432/ubernav?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start backend
        working-directory: backend
        run: |
          node dist/main.js &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/v1/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; exit 1
      - name: Install simulator deps
        working-directory: tools/fake-driver-simulator
        run: npm ci || npm install
      - name: Full ride happy-path
        working-directory: tools/fake-driver-simulator
        run: node full-ride.mjs
      - name: Trip odometer + fare recompute
        working-directory: tools/fake-driver-simulator
        run: node odometer-ride.mjs
      - name: Price comparison (multi-provider + minimum)
        working-directory: tools/fake-driver-simulator
        run: node comparison-check.mjs
      - name: Seed admin for calibration loop
        working-directory: tools/fake-driver-simulator
        run: |
          node -e "import('./lib.mjs').then(m => m.login('+13050000001')).then(() => console.log('admin user created'))"
          psql "$DATABASE_URL" -c "UPDATE users SET role='admin' WHERE phone='+13050000001';"
      - name: Price comparison calibration loop
        working-directory: tools/fake-driver-simulator
        run: node calibration-check.mjs
      - name: Marketplace simulation — smoke (dispatch + SLO gate)
        working-directory: tools/simulation-engine
        # No OSRM in CI → straight-line actor motion (still exercises the full
        # two-sided dispatch/offer/lifecycle path). Non-zero exit on any SLO miss.
        env:
          OSRM_BASE_URL: ''
          TIME_SCALE: '60'
        run: |
          npm ci || npm install
          node run.mjs smoke
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Flutter: static analysis + widget/bloc tests across the whole workspace.
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter (apps + packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Resolve workspace deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        # Only packages/apps that ship a test/ dir; skips the rest cleanly.
        run: |
          set -e
          shopt -s globstar nullglob
          for d in packages/* apps/*; do
            tests=("$d"/test/**/*_test.dart)
            if [ ${#tests[@]} -gt 0 ]; then
              echo "::group::flutter test $d"
              (cd "$d" && flutter test --reporter expanded)
              echo "::endgroup::"
            fi
          done

  # ---------------------------------------------------------------------------
  # Web build: proves all three apps compile for release (artifact of record).
  # ---------------------------------------------------------------------------
  web-build:
    name: Web build (release)
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build all three web apps
        run: |
          set -e
          for app in rider_app driver_app admin_app; do
            echo "::group::build $app"
            (cd "apps/$app" && flutter build web --release --pwa-strategy=none)
            echo "::endgroup::"
          done
