name: core
description: Core app framework (config, network, storage, DI, router, auth) for UberNav.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shared_models:
    path: ../shared_models
  design_system:
    path: ../design_system
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.7.0
  get_it: ^8.0.3
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2
  socket_io_client: ^3.0.2
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.0.11
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
