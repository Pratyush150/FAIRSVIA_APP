name: design_system
description: Shared UI kit (theme + widgets) for the RideVela apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  # Motion & polish primitives shared across all apps:
  #  - flutter_animate: declarative micro-animations (reveals, staggers, shimmer)
  #  - skeletonizer: Airbnb-style skeleton loaders in place of spinners
  #  - animations: Material shared-axis / fade-through page transitions
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # skeletonizer (and our icons) rely on the Material icon font.
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
