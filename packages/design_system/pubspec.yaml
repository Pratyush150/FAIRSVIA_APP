name: design_system
description: Shared UI kit (theme + widgets) for the Ride App apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  # Motion & polish primitives shared across all apps:
  #  - flutter_animate: declarative micro-animations (reveals, staggers, shimmer)
  #  - skeletonizer: Airbnb-style skeleton loaders in place of spinners
  #  - animations: Material shared-axis / fade-through page transitions
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Visual Direction v2 hero art (build-time variants; see AppColors.variant
  # and docs/brand/). 2.0x/ folders are picked up as resolution variants.
  assets:
    - assets/vehicles/midnight/
    - assets/vehicles/clay/
    - assets/vehicles/clay_dark/
    - assets/vehicles/top/
    - assets/vehicles/daylight/
    - assets/heroes/daylight/
  # skeletonizer (and our icons) rely on the Material icon font.
  uses-material-design: true
  fonts:
    # Inter (SIL Open Font License, fonts/Inter-LICENSE.txt): a neutral
    # grotesk of the same weight and rhythm as the big ride-hailing apps.
    # Phosphor icon fonts (MIT, fonts/Phosphor-LICENSE.txt).
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
    # Anek Latin (Ek Type, SIL OFL 1.1, fonts/AnekLatin-LICENSE.txt): Plan D's
    # (THEME=local) UI face. Static instances at wdth=100 cut from the
    # variable font in google/fonts with fontTools' instancer.
    - family: AnekLatin
      fonts:
        - asset: fonts/AnekLatin-Regular.ttf
          weight: 400
        - asset: fonts/AnekLatin-Medium.ttf
          weight: 500
        - asset: fonts/AnekLatin-SemiBold.ttf
          weight: 600
        - asset: fonts/AnekLatin-Bold.ttf
          weight: 700
        - asset: fonts/AnekLatin-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
