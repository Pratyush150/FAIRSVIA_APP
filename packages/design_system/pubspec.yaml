name: design_system
description: Shared UI kit (theme + widgets) for the Ride App apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  # Motion & polish primitives shared across all apps:
  #  - flutter_animate: declarative micro-animations (reveals, staggers, shimmer)
  #  - skeletonizer: Airbnb-style skeleton loaders in place of spinners
  #  - animations: Material shared-axis / fade-through page transitions
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.0.11
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Visual Direction v2 hero art (build-time variants; see AppColors.variant
  # and docs/brand/). 2.0x/ folders are picked up as resolution variants.
  assets:
    # Shipped look (Plan F "Map Glass", the default build — no THEME flag)
    # and Plans B/C: realistic photo cut-out vehicles for the ride list,
    # light + dark, 1x/2x/3x WebP (docs/brand/CREDITS-ride-vehicles.md).
    # The Blender clay renders (assets/vehicles/clay*) are kept in the repo
    # as source art but no longer bundled.
    - assets/vehicles/photo/
    - assets/vehicles/photo_dark/
    # Top-down map markers (every build; ink swaps to ink_top/).
    - assets/vehicles/top/
    # Rider Home: 3D clay art for service tiles and promo banners, cropped
    # from the clay renders (vehicles/clay, docs/brand/icons3d), light + dark.
    - assets/home/
    - assets/home_dark/
    # Rider Home promo banner photos for every build except FAIRSVIA's glass
    # look (Unsplash License, see assets/promo/CREDITS.md).
    # @variant: midnight daylight daynight mono turquoise indigo lapis marigold copper garnet local ink clay3d
    - assets/promo/
    # @end-variant
    # FAIRSVIA's own illustrated posters (the glass build), drawn in-house by
    # tools/brand/build_posters.mjs: no third-party licence.
    # @variant: glass
    - assets/promo_fairsvia/
    # @end-variant
    # Lottie moments: confetti, money, loading, searching, arrived, no cars,
    # success, thanks, location, offline, SOS (assets/lottie/CREDITS.md).
    - assets/lottie/
    # --- Art for looks that do not ship ------------------------------------
    # Each block between `# @variant: <THEME values>` and `# @end-variant`
    # is removed from the release bundle by tools/apk/release_apk.py unless
    # the build's THEME is listed. `flutter test`, `flutter run` and plain
    # `flutter build` keep every block, so all THEME builds still work.
    # @variant: midnight
    - assets/vehicles/midnight/
    # @end-variant
    # @variant: daylight daynight
    # (No code reads vehicles/daylight/ today; kept for Plans B/C.)
    - assets/vehicles/daylight/
    - assets/heroes/daylight/
    # @end-variant
    # Plan E "Ink & Paper" (THEME=ink): line-art renders of the same Blender
    # models (docs/brand/vehicles/clay/render_ink.py + export_ink.py).
    # @variant: ink
    - assets/vehicles/ink/
    - assets/vehicles/ink_dark/
    - assets/vehicles/ink_top/
    # @end-variant
    # Plan G "3D Clay" (THEME=clay3d): hero-size copies of the 3D icon renders
    # (tool/icons3d/build.py HEROES), light and dark.
    # @variant: clay3d
    - assets/heroes/clay3d/
    - assets/heroes/clay3d_dark/
    # @end-variant
  # skeletonizer (and our icons) rely on the Material icon font.
  uses-material-design: true
  fonts:
    # Inter (SIL Open Font License, fonts/Inter-LICENSE.txt): a neutral
    # grotesk of the same weight and rhythm as the big ride-hailing apps.
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
    # Phosphor icon fonts (MIT, fonts/Phosphor-LICENSE.txt).
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
    # --- Fonts for looks that do not ship (see the assets note above) -----
    # Anek Latin (Ek Type, SIL OFL 1.1, fonts/AnekLatin-LICENSE.txt): Plan D's
    # (THEME=local) UI face, and FAIRSVIA's shipped look (glass). Static
    # instances at wdth=100 cut from the variable font in google/fonts with
    # fontTools' instancer.
    # @variant: local glass
    - family: AnekLatin
      fonts:
        - asset: fonts/AnekLatin-Regular.ttf
          weight: 400
        - asset: fonts/AnekLatin-Medium.ttf
          weight: 500
        - asset: fonts/AnekLatin-SemiBold.ttf
          weight: 600
        - asset: fonts/AnekLatin-Bold.ttf
          weight: 700
        - asset: fonts/AnekLatin-ExtraBold.ttf
          weight: 800
    # @end-variant
    # Plan E "Ink & Paper" (THEME=ink) only. Phosphor Light (MIT, same
    # licence file) with the FAIRSVIA glyphs at the same private-use code
    # points (tool/fairsvia_glyphs/build.py light). Instrument Serif (SIL OFL
    # 1.1, fonts/InstrumentSerif-LICENSE.txt): the three serif moments; one
    # weight, never below 22 pt. FairsviaCaps: Inter SemiBold with lowercase
    # drawn as capitals (OFL, derived; tool/ink_caps/build.py) for the
    # small-caps section labels.
    # @variant: ink
    - family: PhosphorLight
      fonts:
        - asset: fonts/Phosphor-Light.ttf
    - family: InstrumentSerif
      fonts:
        - asset: fonts/InstrumentSerif-Regular.ttf
        - asset: fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: FairsviaCaps
      fonts:
        - asset: fonts/FairsviaCaps-SemiBold.ttf
          weight: 600
    # @end-variant
    # Plan G "3D Clay" (THEME=clay3d) only: a colour-bitmap font (CBDT/CBLC
    # + sbix, 128 ppem) whose glyphs at Phosphor's code points are the
    # Blender-rendered 3D icons (docs/brand/icons3d; tool/icons3d/build.py).
    # @variant: clay3d
    - family: Phosphor3D
      fonts:
        - asset: fonts/Phosphor3D.ttf
    # @end-variant
