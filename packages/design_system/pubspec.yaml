name: design_system
description: Shared UI kit (theme + widgets) for the Ride App apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  # Motion & polish primitives shared across all apps:
  #  - flutter_animate: declarative micro-animations (reveals, staggers, shimmer)
  #  - skeletonizer: Airbnb-style skeleton loaders in place of spinners
  #  - animations: Material shared-axis / fade-through page transitions
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Visual Direction v2 hero art (build-time variants; see AppColors.variant
  # and docs/brand/). 2.0x/ folders are picked up as resolution variants.
  assets:
    - assets/vehicles/midnight/
    - assets/vehicles/clay/
    - assets/vehicles/clay_dark/
    - assets/vehicles/top/
    - assets/vehicles/daylight/
    # Plan E "Ink & Paper" (THEME=ink): line-art renders of the same Blender
    # models (docs/brand/vehicles/clay/render_ink.py + export_ink.py).
    - assets/vehicles/ink/
    - assets/vehicles/ink_dark/
    - assets/vehicles/ink_top/
    - assets/heroes/daylight/
  # skeletonizer (and our icons) rely on the Material icon font.
  uses-material-design: true
  fonts:
    # Inter (SIL Open Font License, fonts/Inter-LICENSE.txt): a neutral
    # grotesk of the same weight and rhythm as the big ride-hailing apps.
    # Phosphor icon fonts (MIT, fonts/Phosphor-LICENSE.txt).
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
    # Plan E "Ink & Paper" (THEME=ink) only. Phosphor Light (MIT, same
    # licence file) with the RideVela glyphs at the same private-use code
    # points (tool/ridevela_glyphs/build.py light).
    - family: PhosphorLight
      fonts:
        - asset: fonts/Phosphor-Light.ttf
    # Instrument Serif (SIL OFL 1.1, fonts/InstrumentSerif-LICENSE.txt): the
    # three serif moments of THEME=ink. One weight; never below 22 pt.
    - family: InstrumentSerif
      fonts:
        - asset: fonts/InstrumentSerif-Regular.ttf
        - asset: fonts/InstrumentSerif-Italic.ttf
          style: italic
    # Inter SemiBold with lowercase drawn as capitals (OFL, derived; see
    # tool/ink_caps/build.py): THEME=ink's small-caps section labels.
    - family: RideVelaCaps
      fonts:
        - asset: fonts/RideVelaCaps-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
